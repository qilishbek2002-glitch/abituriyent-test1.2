name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Maxfiy so'z borligini tekshirish
        env:
          ACTIVATION_SECRET: ${{ secrets.ACTIVATION_SECRET }}
        run: |
          if [ -z "$ACTIVATION_SECRET" ]; then
            echo "::error::GitHub Secret 'ACTIVATION_SECRET' topilmadi. Repository -> Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android loyihasini yaratish
        run: |
          flutter create --platforms=android --org uz.abituriyent --project-name abituriyent_test .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py

      - name: Paketlarni yuklash
        run: flutter pub get

      - name: Kodni tekshirish (xato bo'lsa ham davom etadi)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: APK yig'ish
        env:
          ACTIVATION_SECRET: ${{ secrets.ACTIVATION_SECRET }}
        run: flutter build apk --release --dart-define=ACTIVATION_SECRET="$ACTIVATION_SECRET"

      - name: APK ni saqlash (Actions -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: abituriyent-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Releases bo'limiga qo'yish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
